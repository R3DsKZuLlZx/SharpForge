workflow: GitHubFlow/v1
next-version: 1.0.0
tag-prefix: v
branches:
  main:
    regex: ^main$
    mode: ContinuousDeployment
    label: ''
    increment: Patch
  release:
    regex: ^release[/-]
    mode: ContinuousDelivery
    label: ''
    increment: Major
  feature:
    regex: ^feature[/-]
    mode: ContinuousDelivery
    label: '{BranchName}'
    increment: Minor
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDelivery
    label: PullRequest
    increment: Inherit
