workflow: GitHubFlow/v1
next-version: 1.0.0
tag-prefix: "[vV]?"
branches:
  main:
    regex: ^main$
    mode: ContinuousDeployment
    label: ''
    increment: Patch
  feature:
    regex: ^feature[/-]
    mode: ContinuousDelivery
    label: '{BranchName}'
    increment: Minor
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDelivery
    label: PullRequest
    increment: Inherit
