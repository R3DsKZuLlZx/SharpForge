name: PR Validation

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/SharpForge.Client/SharpForge.Client.csproj

      - name: Build
        run: dotnet build src/SharpForge.Client/SharpForge.Client.csproj -c Release --no-restore
