name: Validate content

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/SharpForge.Client/Content/**'
      - 'tests/SharpForge.Content.Tests/**'
      - 'AGENTS.md'
      - '.agents/**'
      - '.claude/**'
      - '.github/prompts/**'
      - '.github/workflows/content-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate blog posts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/SharpForge.Content.Tests/SharpForge.Content.Tests.csproj

      - name: Validate content
        run: >
          dotnet test tests/SharpForge.Content.Tests/SharpForge.Content.Tests.csproj
          --no-restore
          --logger "console;verbosity=normal"

