name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore src/SharpForge.Client/SharpForge.Client.csproj

      - name: Publish
        run: dotnet publish src/SharpForge.Client/SharpForge.Client.csproj -c Release -o release --nologo

      # Blazor WASM needs a custom 404.html for SPA routing on GitHub Pages
      - name: Create 404.html with SPA redirect
        run: |
          cat > release/wwwroot/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <script>
              // Store the attempted URL and redirect to home
              sessionStorage.redirect = location.href;
              location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/');
            </script>
          </head>
          <body>
          </body>
          </html>
          EOF

      # Add .nojekyll to prevent GitHub Pages from ignoring files starting with _
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      # Debug: List published files
      - name: List published files
        run: |
          echo "=== wwwroot contents ==="
          ls -la release/wwwroot/
          echo "=== _framework contents ==="
          ls -la release/wwwroot/_framework/ | head -20

      # Update base href for GitHub Pages (repo name becomes the base path)
      - name: Update base href
        run: |
          sed -i 's|<base href="/"|<base href="/${{ github.event.repository.name }}/"|g' release/wwwroot/index.html
          echo "Updated base href to: /${{ github.event.repository.name }}/"
          grep -i "base href" release/wwwroot/index.html


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

