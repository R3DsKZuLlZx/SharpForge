name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/SharpForge.Client/SharpForge.Client.csproj

      - name: Publish
        run: dotnet publish src/SharpForge.Client/SharpForge.Client.csproj -c Release -o release --nologo

      - name: Copy index.html to 404.html for SPA routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Generate sitemap.xml
        run: |
          BASE_URL="https://sharpforge.co.uk"
          OUT="release/wwwroot/sitemap.xml"

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            grep -rh '^@page "' src/SharpForge.Client/Pages --include="*.razor" \
              | sed 's/@page "\(.*\)"/\1/' \
              | grep -v '^/not-found$' \
              | sort -u \
              | sed 's|.*|  <url><loc>'${BASE_URL}'&</loc></url>|'
            echo '</urlset>'
          } > "$OUT"
          echo "Generated $(grep -c '<url>' "$OUT") URLs → $OUT"

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
